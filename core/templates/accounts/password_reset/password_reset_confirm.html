{% extends "base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1>set new password</h1>

    {% if validlink %}

        <p>Enter your new password:</p>
        <form method="post">{% csrf_token %}
            {{form.as_p}}
        <button type="submit">submit</button>
        </form>
    {% else %}
        <p>Invalid link.</p>
        <a href="{% url 'accounts:password-reset' %}">New link</a>
    {% endif %}
{% endblock %}
