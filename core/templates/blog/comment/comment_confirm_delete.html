{% extends "base/base.html" %}

{% block title %}
    Delete {{ object }}
{% endblock %}

{% block content %}
    <form method="post">{% csrf_token %}
        <p>Are you sure you want to delete "{{ object.content }}"?</p>
        {{ form }}
        <input type="submit" value="Confirm">
        <a href="{% url 'blog:post-detail' pk=object.post.id %}">back</a>
    </form>
{% endblock %}
