{% extends "base/base.html" %}
{% block title %}Delete Comment{% endblock %}

{% block content %}
    <div class="form-card">
        <div class="page-header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 1.5rem;">
            <h1 class="page-title" style="font-size: 1.5rem;">Confirm Deletion</h1>
        </div>
        <form method="post">
            {% csrf_token %}
            <p class="mb-2" style="color: var(--text-primary);">Are you sure you want to delete this comment?</p>
            <p style="color: var(--text-secondary); margin-bottom: 1rem;">"{{ object.content|truncatewords:"5" }}"</p>
            {{ form }}
            <div class="btn-group">
                <input type="submit" value="Confirm Delete" class="btn btn-danger">
                <a href="{% url 'blog:post-detail' pk=object.post.id %}" class="btn">Back to Post</a>
            </div>
        </form>
    </div>
{% endblock %}
